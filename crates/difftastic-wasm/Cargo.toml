[package]
name = "lazers-difftastic-wasm"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
difftastic = { path = "../../vendor/difftastic", default-features = false, features = ["wasm"] }
serde_json = "1.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
