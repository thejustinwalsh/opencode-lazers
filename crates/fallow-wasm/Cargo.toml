[package]
name = "fallow-wasm"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
publish = false

# Own workspace root: the vendored upstream crates keep their own workspace for
# inherited dependency versions, and this crate's lockfile is seeded from the
# upstream Cargo.lock so every shared dependency resolves to the same version.
[workspace]

[[bin]]
name = "fallow-wasi"
path = "src/main.rs"

[features]
# Allocation counters exported to the host, for measuring memory. Not part of any shipped module.
memstats = []

[dependencies]
fallow-extract = { path = "../../vendor/fallow/crates/extract" }
fallow-config = { path = "../../vendor/fallow/crates/config" }
fallow-core = { path = "../../vendor/fallow/crates/core" }
fallow-engine = { path = "../../vendor/fallow/crates/engine" }
fallow-types = { path = "../../vendor/fallow/crates/types" }
fallow-api = { path = "../../vendor/fallow/crates/api" }
globset = "0.4"
rustc-hash = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
# Speed first: opt-level 3 ran the five report sections about 25% faster than "z" on this
# repository (see .agents/plans/fallow-wasm-tools.md); the module is larger and that is accepted.
opt-level = 3
panic = "abort"
strip = "debuginfo"
