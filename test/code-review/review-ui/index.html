<!doctype html>
<html lang="en" data-mode="dark">
  <head>
    <meta charset="UTF-8" />
    <title>Review renderer harness</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--background-base);
        color: var(--text-base);
        font:
          13px -apple-system,
          system-ui,
          sans-serif;
      }
      #root {
        height: 100%;
      }
      .shell {
        height: 100%;
        display: flex;
        flex-direction: column;
        border-right: 1px solid var(--border-weak-base);
        box-sizing: border-box;
      }
      .scroller {
        flex: 1;
        min-height: 0;
        overflow-x: hidden;
        overflow-y: auto;
        outline: none;
      }
      .hdr {
        display: flex;
        gap: 6px;
        align-items: center;
        height: 32px;
        padding: 0 12px;
        font-size: 12px;
        background: var(--background-base);
        border-top: 1px solid var(--border-weak-base);
        border-bottom: 1px solid var(--border-weak-base);
        color: var(--text-strong);
      }
      .hdr small {
        color: var(--text-weaker);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
