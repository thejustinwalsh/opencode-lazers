name: Release plugin

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag (vMAJOR.MINOR.PATCH)"
        required: true
        type: string
      publish:
        description: "Publish this existing tag to npm and GitHub"
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: plugin-release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.publish && inputs.version || github.ref }}
      - name: Check release version
        if: github.event_name == 'push' || inputs.publish
        env:
          RELEASE_TAG: ${{ inputs.version || github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const version = JSON.parse(readFileSync("package.json")).version;
          if (process.env.RELEASE_TAG !== `v${version}`)
            throw Error(`Tag ${process.env.RELEASE_TAG} does not match package version ${version}`);
          NODE
      - name: Install the pinned Bun build
        run: |
          bun_version="$(node -p 'require("./package.json").packageManager.replace(/^bun@/, "")')"
          npm install --prefix "$RUNNER_TEMP/lazers-bun" --no-audit --no-fund "bun@$bun_version"
          echo "$RUNNER_TEMP/lazers-bun/node_modules/.bin" >> "$GITHUB_PATH"
      - run: bun install --frozen-lockfile
      - run: bun run verify
      - run: git diff --exit-code
      - run: bun run test src/webgpu src/radar/packaging.test.ts scripts/native-binary-check.test.ts
      - name: Test release tooling
        if: hashFiles('scripts/release-notes.test.ts') != ''
        run: bun run test scripts/release-notes.test.ts scripts/code-review-package/review-package-files.test.ts
      - name: Prepare release changelog
        env:
          RELEASE_TAG: ${{ inputs.version || github.ref_name }}
        run: |
          mkdir -p release
          notes="docs/releases/${RELEASE_TAG#v}.md"
          if test -f "$notes"; then
            cp "$notes" release/CHANGELOG.md
          else
            bun scripts/release-notes.ts "$RELEASE_TAG" release/CHANGELOG.md HEAD
          fi
      - name: Build and smoke-install the release package
        env:
          RELEASE_TAG: ${{ inputs.version || github.ref_name }}
        run: bun run package:release "$RELEASE_TAG" release release/CHANGELOG.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: opencode-lazers
          path: |
            release/*.tgz
            release/CHANGELOG.md
          if-no-files-found: error
          compression-level: 0
  publish:
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.publish)
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Install npm with trusted-publishing support
        run: npm install --global npm@12.2.3
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: opencode-lazers
          path: release
      - name: Reuse an existing published archive
        run: |
          if gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' > existing-assets.txt; then
            asset="opencode-lazers-${RELEASE_TAG#v}.tgz"
            if grep -Fxq "$asset" existing-assets.txt; then
              gh release download "$RELEASE_TAG" --pattern "$asset" --dir release --clobber
            fi
          fi
      - name: Publish the tested archive to npm
        run: |
          asset="release/opencode-lazers-${RELEASE_TAG#v}.tgz"
          package="opencode-lazers@${RELEASE_TAG#v}"
          if npm view "$package" dist.integrity --json > published-integrity.json 2>/dev/null; then
            node --input-type=module - "$asset" <<'NODE'
          import { readFileSync } from "node:fs";
          import { createHash } from "node:crypto";
          const actual = "sha512-" + createHash("sha512").update(readFileSync(process.argv[2])).digest("base64");
          if (JSON.parse(readFileSync("published-integrity.json")) !== actual)
            throw Error("The npm version already exists with a different archive; versions cannot be replaced");
          console.log("The exact release archive is already published");
          NODE
          else
            npm publish "$asset" --access public --tag latest --provenance
          fi
      - name: Publish GitHub release and changelog
        run: |
          asset="release/opencode-lazers-${RELEASE_TAG#v}.tgz"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            if ! grep -Fxq "$(basename "$asset")" existing-assets.txt; then
              gh release upload "$RELEASE_TAG" "$asset"
            fi
            gh release upload "$RELEASE_TAG" release/CHANGELOG.md --clobber
            gh release edit "$RELEASE_TAG" --draft=false --latest --notes-file release/CHANGELOG.md
          else
            gh release create "$RELEASE_TAG" "$asset" release/CHANGELOG.md --verify-tag --latest --notes-file release/CHANGELOG.md
          fi
