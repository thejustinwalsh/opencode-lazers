name: Deploy website

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "package.json"
      - ".github/workflows/website.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install the pinned Bun build
        run: |
          bun_version="$(node -p 'require("./package.json").packageManager.replace(/^bun@/, "")')"
          npm install --prefix "$RUNNER_TEMP/lazers-bun" --no-audit --no-fund "bun@$bun_version"
          echo "$RUNNER_TEMP/lazers-bun/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Build the website
        working-directory: website
        run: |
          bun install --frozen-lockfile
          bun run build
          test -s dist/index.html
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
